<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNTAX_FORGE // Secure Remote Command Center</title>
    <style>
        :root {
            --bg: #030305;
            --panel: #0d0d12;
            --cyan: #00f3ff;
            --gold: #ffb700;
            --danger: #ff3366;
            --green: #00ff66;
            --text: #c0c0c0;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: var(--cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
            border-bottom: 1px solid #1a1a24;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background-color: var(--panel);
            border: 1px solid #1a1a24;
            border-left: 4px solid var(--cyan);
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }
        .card h3 {
            margin-top: 0;
            color: var(--gold);
        }
        input, select, button {
            background: #000;
            color: var(--cyan);
            border: 1px solid var(--cyan);
            padding: 10px;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            font-family: inherit;
            box-sizing: border-box;
        }
        button:hover {
            background-color: var(--cyan);
            color: #000;
            box-shadow: 0 0 12px var(--cyan);
        }
        .danger-btn {
            border-color: var(--danger);
            color: var(--danger);
        }
        .danger-btn:hover {
            background-color: var(--danger);
            color: #fff;
            box-shadow: 0 0 12px var(--danger);
        }
        .console {
            background: #000;
            border: 1px dashed #333;
            padding: 12px;
            height: 180px;
            overflow-y: auto;
            font-size: 0.85em;
            color: var(--green);
            margin-top: 15px;
        }
        .status-dot {
            height: 12px;
            width: 12px;
            background-color: var(--green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--green);
        }
    </style>
</head>
<body>

    <h2>
        ⚡ SECURE COMMAND CENTER 
        <span style="font-size: 0.5em; display: flex; align-items: center; gap: 8px;">
            System Online <span class="status-dot"></span>
        </span>
    </h2>

    <div class="grid">
        <!-- Panel Target & Status -->
        <div class="card">
            <h3>Pilih Target Perangkat</h3>
            <label for="device-select">Daftar Perangkat Online:</label>
            <select id="device-select">
                <option value="">-- Menunggu Perangkat Terhubung --</option>
            </select>
            <button onclick="simulateTargetLogin()" style="margin-top: 15px; border-color: var(--gold); color: var(--gold);">[Simulasi] Hubungkan HP Target di Sini</button>
        </div>

        <!-- Panel Kontrol Aksi -->
        <div class="card">
            <h3>Eksekusi Perintah Jarak Jauh</h3>
            <button onclick="sendCommand('GET_BATTERY')">🔋 Cek Baterai & Suhu</button>
            <button onclick="sendCommand('TAKE_SCREENSHOT')">📸 Ambil Tangkapan Layar</button>
            <button onclick="sendCommand('VIBRATE_DEVICE')">📳 Panggil Perangkat (Vibrate)</button>
            <button class="danger-btn" onclick="sendCommand('LOCK_SCREEN')">🔒 Kunci Layar Paksa</button>
        </div>

        <!-- Live Telemetry & Log -->
        <div class="card" style="grid-column: span 1 / -1;">
            <h3>Live Telemetry & Log Aktivitas Real-time</h3>
            <div class="console" id="console-log">[SYSTEM] Memuat antarmuka kontrol... Terhubung ke relay server.</div>
        </div>
    </div>

    <!-- Socket.io Client Library -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const consoleLog = document.getElementById('console-log');
        const deviceSelect = document.getElementById('device-select');

        // Daftarkan diri sebagai Web Dashboard
        socket.emit('register-dashboard');

        function logMessage(msg, color = 'var(--green)') {
            const time = new Date().toLocaleTimeString();
            consoleLog.innerHTML += `<br><span style="color:${color}">[${time}] ${msg}</span>`;
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        // Update daftar perangkat online di dropdown
        socket.on('device-list-update', (devices) => {
            deviceSelect.innerHTML = '';
            if (devices.length === 0) {
                deviceSelect.innerHTML = '<option value="">-- Tidak ada perangkat online --</option>';
                return;
            }
            devices.forEach(dev => {
                const opt = document.createElement('option');
                opt.value = dev.deviceId;
                opt.textContent = `${dev.deviceName} (${dev.deviceId})`;
                deviceSelect.appendChild(opt);
            });
            logMessage(`Daftar perangkat diperbarui. Total online: ${devices.length}`, 'var(--cyan)');
        });

        // Kirim perintah ke target terpilih
        function sendCommand(action) {
            const targetId = deviceSelect.value;
            if (!targetId) {
                alert('Pilih perangkat target terlebih dahulu!');
                return;
            }
            logMessage(`Mengirim perintah [${action}] ke target ID: ${targetId}`, 'var(--gold)');
            socket.emit('send-command', { targetId, action });
        }

        // Tangkap respon balik dari target
        socket.on('broadcast-response', (res) => {
            logMessage(`[RESPON ${res.deviceId}] ${res.message}`);
        });

        // Fungsionalitas simulasi HP Target (Bisa diuji langsung di browser)
        function simulateTargetLogin() {
            const testId = 'REDMI_A2_ZEEO';
            const testSocket = io();
            testSocket.emit('register-device', { deviceId: testId, deviceName: 'Redmi A2 (Zeeo)' });
            
            testSocket.on('execute-command', (data) => {
                console.log("Perintah diterima di target simulasi:", data.action);
                let reply = '';
                if(data.action === 'GET_BATTERY') reply = 'Baterai: 90% (Suhu: 31°C - Normal)';
                else if(data.action === 'VIBRATE_DEVICE') reply = 'Perangkat berhasil digetarkan.';
                else reply = `Aksi ${data.action} berhasil dieksekusi di background.`;

                // Kirim balik laporan ke server
                testSocket.emit('device-response', { deviceId: testId, message: reply });
            });
            alert('Simulasi HP Target berhasil dihubungkan! Cek dropdown perangkat di panel.');
        }
    </script>
</body>
</html>
